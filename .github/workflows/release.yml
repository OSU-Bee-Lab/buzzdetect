name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild (e.g. v0.2.0)'
        required: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # No universal macOS build: onnxruntime publishes no universal2
          # wheel, so PyInstaller can only freeze the engine for the arch it
          # runs on. macos-14 is Apple silicon, macos-13 is Intel.
          - platform: macos-14
            args: --bundles dmg,app
            triple: aarch64-apple-darwin
            engine_flags: ''
          - platform: macos-13
            args: --bundles dmg,app
            triple: x86_64-apple-darwin
            engine_flags: ''
          - platform: ubuntu-22.04
            args: --bundles appimage,deb
            triple: x86_64-unknown-linux-gnu
            engine_flags: ''
          - platform: windows-latest
            args: --bundles nsis
            triple: x86_64-pc-windows-msvc
            engine_flags: ''
          # CUDA variants. Separate installers rather than fattening the
          # default ones: they bundle onnxruntime-gpu plus the NVIDIA runtime,
          # which is ~1GB that only an NVIDIA user can execute. The config
          # overlay renames the product so both can be published to the same
          # release (and installed side by side) without colliding.
          - platform: ubuntu-22.04
            args: --bundles appimage,deb --config src-tauri/tauri.cuda.conf.json
            triple: x86_64-unknown-linux-gnu
            engine_flags: '--cuda'
          - platform: windows-latest
            args: --bundles nsis --config src-tauri/tauri.cuda.conf.json
            triple: x86_64-pc-windows-msvc
            engine_flags: '--cuda'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # The engine is frozen with PyInstaller, which needs a real Python
      # toolchain; uv provides one and installs engine/requirements-onnx.txt
      # into the throwaway venv that scripts/build-engine.mjs creates.
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install frontend dependencies
        run: npm ci

      # Must run before tauri-action: it produces the sidecar binary and the
      # engine payload that tauri.conf.json's externalBin/resources point at,
      # and the bundle step fails outright if they're missing.
      - name: Build the engine sidecar
        run: node scripts/build-engine.mjs ${{ matrix.engine_flags }}
        env:
          ENGINE_TARGET_TRIPLE: ${{ matrix.triple }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: buzzdetect2 ${{ inputs.tag || github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Publishes copies of the installers under names a user can recognise, since
  # the raw ones carry version and arch strings that mean nothing to someone
  # just trying to download the app.
  rename-assets:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish user-friendly copies of release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          REPO="${{ github.repository }}"
          RELEASE_ID=$(gh api "repos/${REPO}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id")

          # Has to go through the authenticated asset API rather than
          # browser_download_url: the release is still a draft here, and an
          # unauthenticated fetch of a draft asset quietly returns a tiny
          # "Not Found" body that would then be published under the friendly
          # name. The size floor below is the backstop for that.
          copy_asset() {
            local from="$1"
            local to="$2"
            local id
            id=$(gh api "repos/${REPO}/releases/${RELEASE_ID}/assets" --paginate \
              --jq ".[] | select(.name == \"$from\") | .id")
            if [ -z "$id" ]; then
              echo "Skipped (not found): $from"
              return
            fi
            gh api -H 'Accept: application/octet-stream' \
              "repos/${REPO}/releases/assets/${id}" > "$to"
            local size
            size=$(stat -c%s "$to")
            if [ "$size" -lt 10000000 ]; then
              echo "Downloaded $from is only ${size} bytes - refusing to publish $to" >&2
              exit 1
            fi
            gh release upload "$TAG" "$to" -R "$REPO" --clobber
            echo "Published: $from -> $to (${size} bytes)"
          }

          copy_asset "buzzdetect2_${VERSION}_aarch64.dmg"   "buzzdetect2-macOS-AppleSilicon.dmg"
          copy_asset "buzzdetect2_${VERSION}_x64.dmg"       "buzzdetect2-macOS-Intel.dmg"
          copy_asset "buzzdetect2_${VERSION}_amd64.AppImage" "buzzdetect2-Linux.AppImage"
          copy_asset "buzzdetect2_${VERSION}_amd64.deb"      "buzzdetect2-Linux.deb"
          copy_asset "buzzdetect2_${VERSION}_x64-setup.exe"  "buzzdetect2-Windows.exe"

          copy_asset "buzzdetect2-cuda_${VERSION}_amd64.AppImage" "buzzdetect2-Linux-CUDA.AppImage"
          copy_asset "buzzdetect2-cuda_${VERSION}_amd64.deb"      "buzzdetect2-Linux-CUDA.deb"
          copy_asset "buzzdetect2-cuda_${VERSION}_x64-setup.exe"  "buzzdetect2-Windows-CUDA.exe"
