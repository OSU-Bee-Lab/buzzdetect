name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild (e.g. v0.2.0)'
        required: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # No universal macOS build: onnxruntime publishes no universal2
          # wheel, so PyInstaller can only freeze the engine for the arch it
          # runs on. macos-14 is Apple silicon, macos-15-intel is Intel --
          # don't move that one back to macos-13, which GitHub has retired:
          # the job doesn't fail, it queues forever, stranding rename-assets
          # behind it.
          - platform: macos-14
            args: --bundles dmg,app
            triple: aarch64-apple-darwin
            engine_flags: ''
          - platform: macos-15-intel
            args: --bundles dmg,app
            triple: x86_64-apple-darwin
            engine_flags: ''
          - platform: ubuntu-22.04
            args: --bundles appimage,deb
            triple: x86_64-unknown-linux-gnu
            engine_flags: ''
          - platform: windows-latest
            args: --bundles nsis
            triple: x86_64-pc-windows-msvc
            engine_flags: ''
          # CUDA variants. Separate installers rather than fattening the
          # default ones: they bundle onnxruntime-gpu plus the NVIDIA runtime,
          # which is ~1GB that only an NVIDIA user can execute. The config
          # overlay renames the product so both can be published to the same
          # release (and installed side by side) without colliding.
          - platform: ubuntu-22.04
            args: --bundles appimage,deb --config src-tauri/tauri.cuda.conf.json
            triple: x86_64-unknown-linux-gnu
            engine_flags: '--cuda'
          - platform: windows-latest
            args: --bundles nsis --config src-tauri/tauri.cuda.conf.json
            triple: x86_64-pc-windows-msvc
            engine_flags: '--cuda'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # A stock ubuntu runner has ~14GB free and a CUDA build wants more than
      # that: the build venv unpacks ~5GB of nvidia wheels, PyInstaller stages
      # a copy of everything it freezes, and cargo and the AppImage each want a
      # few GB of their own. The v0.3.0 run died linking the Rust lib with
      # ENOSPC. None of the toolchains removed here are used by this job.
      - name: Free up disk space
        if: startsWith(matrix.platform, 'ubuntu') && matrix.engine_flags != ''
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/lib/node_modules \
            /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      # nvprune strips device code for GPUs this build doesn't support, which
      # is the only reason the CUDA payload fits in a release at all -- see
      # pruneArchitectures in scripts/build-engine.mjs. It ships only as part
      # of the CUDA toolkit, but NVIDIA redistributes each component on its
      # own, so we take the ~250KB one rather than several GB of toolkit.
      - name: Install nvprune
        if: matrix.engine_flags != ''
        shell: bash
        run: |
          set -euo pipefail
          base=https://developer.download.nvidia.com/compute/cuda/redist/cuda_nvprune
          mkdir -p nvprune-pkg
          # Two archive formats, and one extractor each that the runner is
          # certain to have: GNU tar reads .tar.xz, and bash on Windows is Git
          # Bash, which has neither unzip nor a bsdtar to read the .zip with.
          if [ "$RUNNER_OS" = "Windows" ]; then
            curl -sSL -o nvprune.zip \
              "$base/windows-x86_64/cuda_nvprune-windows-x86_64-12.9.82-archive.zip"
            powershell -NoProfile -Command \
              "Expand-Archive -Path nvprune.zip -DestinationPath nvprune-pkg -Force"
          else
            curl -sSL -o nvprune.tar.xz \
              "$base/linux-x86_64/cuda_nvprune-linux-x86_64-12.9.82-archive.tar.xz"
            tar -xJf nvprune.tar.xz -C nvprune-pkg
          fi
          bin=$(find nvprune-pkg -type f \( -name nvprune -o -name nvprune.exe \) | head -1)
          [ -n "$bin" ] || { echo 'no nvprune in the archive'; exit 1; }
          chmod +x "$bin"
          "$bin" --version || "$bin" --help || { echo 'nvprune not runnable'; exit 1; }
          # GITHUB_PATH wants a native path; Git Bash's /d/a/... form is one
          # later steps can't resolve.
          dir=$(cd "$(dirname "$bin")" && pwd)
          if [ "$RUNNER_OS" = "Windows" ]; then dir=$(cygpath -w "$dir"); fi
          echo "$dir" >> "$GITHUB_PATH"

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # The engine is frozen with PyInstaller, which needs a real Python
      # toolchain; uv provides one and installs engine/requirements-onnx.txt
      # into the throwaway venv that scripts/build-engine.mjs creates.
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install frontend dependencies
        run: npm ci

      # Must run before tauri-action: it produces the sidecar binary and the
      # engine payload that tauri.conf.json's externalBin/resources point at,
      # and the bundle step fails outright if they're missing.
      - name: Build the engine sidecar
        run: node scripts/build-engine.mjs ${{ matrix.engine_flags }}
        env:
          ENGINE_TARGET_TRIPLE: ${{ matrix.triple }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: buzzdetect2 ${{ inputs.tag || github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Publishes copies of the installers under names a user can recognise, since
  # the raw ones carry version and arch strings that mean nothing to someone
  # just trying to download the app.
  rename-assets:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish user-friendly copies of release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          REPO="${{ github.repository }}"
          RELEASE_ID=$(gh api "repos/${REPO}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id")

          # Has to go through the authenticated asset API rather than
          # browser_download_url: the release is still a draft here, and an
          # unauthenticated fetch of a draft asset quietly returns a tiny
          # "Not Found" body that would then be published under the friendly
          # name. The size floor below is the backstop for that.
          copy_asset() {
            local from="$1"
            local to="$2"
            local id
            id=$(gh api "repos/${REPO}/releases/${RELEASE_ID}/assets" --paginate \
              --jq ".[] | select(.name == \"$from\") | .id")
            if [ -z "$id" ]; then
              echo "Skipped (not found): $from"
              return
            fi
            gh api -H 'Accept: application/octet-stream' \
              "repos/${REPO}/releases/assets/${id}" > "$to"
            local size
            size=$(stat -c%s "$to")
            if [ "$size" -lt 10000000 ]; then
              echo "Downloaded $from is only ${size} bytes - refusing to publish $to" >&2
              exit 1
            fi
            gh release upload "$TAG" "$to" -R "$REPO" --clobber
            echo "Published: $from -> $to (${size} bytes)"
          }

          copy_asset "buzzdetect2_${VERSION}_aarch64.dmg"   "buzzdetect2-macOS-AppleSilicon.dmg"
          copy_asset "buzzdetect2_${VERSION}_x64.dmg"       "buzzdetect2-macOS-Intel.dmg"
          copy_asset "buzzdetect2_${VERSION}_amd64.AppImage" "buzzdetect2-Linux.AppImage"
          copy_asset "buzzdetect2_${VERSION}_amd64.deb"      "buzzdetect2-Linux.deb"
          copy_asset "buzzdetect2_${VERSION}_x64-setup.exe"  "buzzdetect2-Windows.exe"

          copy_asset "buzzdetect2-cuda_${VERSION}_amd64.AppImage" "buzzdetect2-Linux-CUDA.AppImage"
          copy_asset "buzzdetect2-cuda_${VERSION}_amd64.deb"      "buzzdetect2-Linux-CUDA.deb"
          copy_asset "buzzdetect2-cuda_${VERSION}_x64-setup.exe"  "buzzdetect2-Windows-CUDA.exe"
