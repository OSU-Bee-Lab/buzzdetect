[package]
name = "buzzdetect"
version = "2.0.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "buzzdetect_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.2"
# In-place updates from the release's latest.json; see src/updater.rs.
tauri-plugin-updater = "2"
# Model bundles collaborators share are .zip files; import_model extracts them.
zip = { version = "2", default-features = false, features = ["deflate"] }
# The model catalog (src/catalog.rs). The same reqwest/rustls the updater
# already pulls in, configured the same way: ring as the crypto provider.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.10"
semver = "1"

# Cancelling an analysis has to signal a whole process group, not one pid --
# see cancel_analysis in src/lib.rs.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
